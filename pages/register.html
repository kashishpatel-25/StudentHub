<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .register-section {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
        }

        .register-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #e0e7ff;
            box-shadow: 0 10px 30px rgba(30, 64, 175, 0.10);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h2 {
            color: #172554;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .register-header p {
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 1rem;
            color: #334155;
            background: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 5px 0 25px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .terms input {
            margin-top: 5px;
            accent-color: #2563eb;
        }

        .register-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #4338ca);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.20);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            color: #4338ca;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .register-section {
                padding: 30px 0;
            }

            .register-card {
                padding: 28px 20px;
                border-radius: 16px;
            }

            .register-header h2 {
                font-size: 1.7rem;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="header-content">
            <div>
                <h1>StudentHub</h1>
                <p>Your Complete Student Portal</p>
            </div>
        </div>
    </header>

    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="register.html" class="active">Register</a>
            <a href="login.html">Login</a>
            <a href="events.html">Events</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="container">

        <section class="register-section">

            <div class="register-card">

                <div class="register-header">
                    <h2>Create Your Account</h2>
                    <p>Join StudentHub and manage your student activities easily.</p>
                </div>

                <form action="#" method="post">

                    <div class="form-row">

                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                placeholder="Enter first name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                placeholder="Enter last name"
                                required
                            >
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="email">College Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your college email"
                            required
                        >
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="studentId">Student ID</label>
                            <input
                                type="text"
                                id="studentId"
                                name="studentId"
                                placeholder="Enter student ID"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="semester">Semester</label>
                            <select id="semester" name="semester" required>
                                <option value="">Select semester</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="course">Course / Department</label>
                        <input
                            type="text"
                            id="course"
                            name="course"
                            placeholder="Enter your course or department"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >
                    </div>

                    <div class="terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">
                            I agree to the terms and conditions of StudentHub.
                        </label>
                    </div>

                    <button type="submit" class="register-button">
                        Create Account
                    </button>

                </form>

                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </div>

        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <h3>StudentHub</h3>
            <p>Your Complete Student Portal</p>
            <p>© 2026 StudentHub. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
